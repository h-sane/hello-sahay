# Local Postgres + pgvector for development.
# Port 5433 on the host so it doesn't clash with a locally installed Postgres on 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sahay
      POSTGRES_PASSWORD: sahay
      POSTGRES_DB: sahay
    ports:
      - "5433:5432"
    volumes:
      - sahay_db:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahay -d sahay"]
      interval: 5s
      retries: 10

volumes:
  sahay_db:
